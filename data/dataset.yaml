schema_version: 1

paths:
  paired: paired
  manifests: manifests
  splits: splits
  quality: quality
  cache: cache

categories:
  labels_to_slugs:
    health: health
    "health+sick": health_sick
    sick: sick

image_contract:
  rgb_source_mode: RGB
  ir_source_modes: [RGB]
  ir_model_channels: 1
  ir_conversion: bt601
  bt601_weights: [0.299, 0.587, 0.114]
  source_bit_depth: 8
  output_range: [0.0, 1.0]
  future_ir_policy: require_schema_upgrade

preprocessing:
  crop_size: 448
  model_downsample_factor: 32
  pad_mode: reflect
  standardize: false
  statistics_source: train_only
  train:
    random_crop: true
    horizontal_flip_probability: 0.5
    vertical_flip_probability: 0.0
    rotation_probability: 0.0
    max_rotation_degrees: 5.0
  validation:
    mode: center_crop
    random: false
  test:
    mode: center_crop
    random: false
  rgb_augmentation:
    enabled: false
    probability: 0.5
    brightness: 0.10
    contrast: 0.10
    saturation: 0.10
    hue: 0.02

splitting:
  outer:
    train_pool: 0.80
    test: 0.20
  inner:
    train: 0.80
    val: 0.20
  minimum_complete_groups: 6
  default_seed: 42
  grouping_field: leakage_group_id
  experiment_key_fields:
    - study_day
    - experiment_id
  required_categories:
    - health
    - health_sick
    - sick
  clips_per_category: 1
  stratification_fields:
    - category
    - study_day
    - lighting_condition
    - scene_condition
  algorithm: deterministic_nested_group_split_v2

audit:
  phash_size: 8
  phash_high_frequency_factor: 4
  near_duplicate_hamming_threshold: 5
  registration_resize_width: 256
  registration_review_threshold: 0.10

training:
  batch_size: 2
  epochs: 50
  learning_rate: 0.0001
  num_workers: 0
  seed: 42
  amp: true
  sampler: epoch_shuffle

inference:
  mode: auto
  tile_size: 448
  overlap: 64
  max_full_tokens: 12544
